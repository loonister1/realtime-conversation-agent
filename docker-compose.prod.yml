version: "3.4"

x-common: &common
  stdin_open: true
  tty: true
  restart: unless-stopped

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    <<: *common

  nginx:
    image: nginx:1.20.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - server
      - client
    env_file:
      - .env
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    <<: *common
  # NOTE: In production environments, use managed databases (AWS RDS, Google Cloud SQL, Azure Database, etc.)
  # Update DATABASE_URL in .env to point to your managed database
  # Example: DATABASE_URL=postgresql+asyncpg://username:password@your-rds-endpoint:5432/database_name
