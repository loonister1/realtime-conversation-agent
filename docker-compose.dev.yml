version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./server:/app
    env_file:
      - server/.env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - client
